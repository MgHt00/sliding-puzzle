<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Puzzle</title>
  <link rel="stylesheet" href="src/css/index.css">
</head>
<body>
  <section class="puzzle-board">
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
    <div class="puzzle-tile"></div>
  </section>

  <section class="overlay"></div> <!-- Made visible by default -->
  <section class="loading-spinner"> <!-- Made visible by default -->
    <div class="spinner-grow" role="status">
      <span class="invisible">Loading...</span>
    </div>
  </section>
  <section class="alert-message">
    <div class="winning-alert alert alert-success alert-dismissible fade show d-none" role="alert">
      <div><strong>Congratulations!</strong> You have won!</div>
      <button type="button" class="btn-close btn-close-win-alert" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </section>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
