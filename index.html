<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Puzzle</title>
  <link rel="stylesheet" href="src/css/index.css">
</head>
<body>
  <nav class="navbar bg-body-tertiary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
        aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill"
          viewBox="0 0 16 16">
          <path
            d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
        </svg>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
        aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-end offcanvas-panel" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h4 class="offcanvas-title" id="offcanvasNavbarLabel">Game Settings</h4>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <h5>Board Size</h5>
          <div class="setting-grid-size">
            <input type="radio" class="btn-check grid-size" name="options-base" id="setting-grid-3x3" value="3" autocomplete="off"
              checked>
            <label class="btn btn-label" for="setting-grid-3x3">3x3</label>
          
            <input type="radio" class="btn-check grid-size" name="options-base" id="setting-grid-4x4" value="4" autocomplete="off">
            <label class="btn btn-label" for="setting-grid-4x4">4x4</label>
          </div>

          <h5>Content Type</h5>
          <div class="setting-content">
            <input type="radio" class="btn-check form-check-input content-type content-arabic-number"
              name="setting-contentType-radio" id="setting-contentType-arabic-numbers" value="arabic-numbers" autocomplete="off"
              checked>
            <label class="btn btn-label" for="setting-contentType-arabic-numbers">Arabic Numbers</label>
          
            <input type="radio" class="btn-check form-check-input content-type content-japanese-number"
              name="setting-contentType-radio" id="setting-contentType-japanese-numbers" value="japanese-numbers"
              autocomplete="off">
            <label class="btn btn-label" for="setting-contentType-japanese-numbers">Japanese Numbers</label>
          
          </div>
      </div>
    </div>
  </nav>

  <section class="puzzle-board three-by-three-board">
    <!--<div class="puzzle-tile"></div>-->
  </section>

  <section class="d-grid col-6 mx-auto reset">
    <button type="button" class="btn-reset btn btn-outline-light">Reset</button>
  </section>

  <section class="overlay"></div> <!-- Made visible by default -->
  <section class="loading-spinner"> <!-- Made visible by default -->
    <div class="spinner-grow" role="status">
      <span class="invisible">Loading...</span>
    </div>
  </section>

  <section class="alert-wrapper alert alert-primary d-flex flex-column d-none" role="alert">
    <h5 class="alert-heading"></h5>
    <span class="alert-content"></span>
    <div class="alert-buttons d-flex justify-content-center">
      <button type="button" class="alert-confirm-btn btn btn-outline-light btn-sm"></button>
      <button type="button" class="alert-cancel-btn btn btn-outline-light btn-sm"></button>
    </div>
  </section>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
